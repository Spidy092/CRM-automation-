# ─────────────────────────────────────────────────────────────────────────────
# Nginx config for serving the React SPA.
# - SPA routing: falls back to /index.html for unknown routes
# - Long-cache hashed assets, no-cache for index.html
# - Gzip for text payloads
# - Security headers (CSP, X-Frame-Options, Referrer-Policy)
# ─────────────────────────────────────────────────────────────────────────────

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Hide nginx version
  server_tokens off;

  # ── Security headers ──────────────────────────────────────────────────────
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Tight CSP — adjust if you add third-party scripts/analytics
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self';" always;

  # ── Gzip ──────────────────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml;

  # ── Static assets (hashed by Vite, safe to cache 1y) ──────────────────────
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # ── SPA fallback ──────────────────────────────────────────────────────────
  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }

  # ── Health endpoint for the frontend container itself ──────────────────────
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}

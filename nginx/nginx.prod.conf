# ─────────────────────────────────────────────────────────────────────────────
# Production reverse proxy.
# - Listens on 80 (and 443 if certs are mounted)
# - Proxies /api/*  → api:3000
# - Proxies /health → api:3000/health  (used by Docker healthcheck)
# - Serves the React SPA at /
# - Rate limiting at the edge
# ─────────────────────────────────────────────────────────────────────────────

# Rate limit zone — 10 req/s per IP for public endpoints
limit_req_zone $binary_remote_addr zone=public:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

# Upstream — service name from docker-compose network
upstream crm_api {
  server api:3000;
  keepalive 16;
}

upstream crm_frontend {
  server frontend:80;
  keepalive 8;
}

# ── HTTP — Redirect to HTTPS ───────────
server {
  listen 80;
  server_name crm.gururajhr.in _;

  # Allow certbot
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Health endpoint (used by Docker healthcheck on the proxy itself)
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # Redirect all other HTTP traffic to HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# ── HTTPS ──────────────
server {
  listen 443 ssl http2;
  server_name crm.gururajhr.in;

  ssl_certificate     /etc/nginx/ssl/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: http: https:;" always;

  # Health endpoint
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # Real-time notification SSE streaming endpoint (unbuffered)
  location /api/v1/notifications/stream {
    proxy_pass http://crm_api;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_read_timeout 86400s;
  }

  # API — proxied to backend
  location /api/ {
    limit_req zone=api burst=200 nodelay;
    proxy_pass http://crm_api;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_read_timeout 60s;
  }

  # Health check passthrough (no rate limit)
  location = /health {
    proxy_pass http://crm_api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
  }

  # OAuth 2.0 server endpoints (for Claude Web MCP Connector)
  location /.well-known/ {
    proxy_pass http://crm_api;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
  }

  location /oauth/ {
    proxy_pass http://crm_api;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
  }

  # Everything else — SPA
  location / {
    limit_req zone=public burst=20 nodelay;
    proxy_pass http://crm_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

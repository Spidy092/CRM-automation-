# ─────────────────────────────────────────────────────────────────────────────
# Production reverse proxy.
# - Listens on 80 (and 443 if certs are mounted)
# - Proxies /api/*  → api:3000
# - Proxies /health → api:3000/health  (used by Docker healthcheck)
# - Serves the React SPA at /
# - Rate limiting at the edge
# ─────────────────────────────────────────────────────────────────────────────

# Rate limit zone — 10 req/s per IP for public endpoints
limit_req_zone $binary_remote_addr zone=public:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

# Upstream — service name from docker-compose network
upstream crm_api {
  server api:3000;
  keepalive 16;
}

upstream crm_frontend {
  server frontend:80;
  keepalive 8;
}

# ── HTTP — also handles ACME http-01 challenges for Let's Encrypt ───────────
server {
  listen 80;
  server_name _;

  # Allow certbot
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Health endpoint (used by Docker healthcheck on the proxy itself)
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # API — proxied to backend
  location /api/ {
    limit_req zone=api burst=200 nodelay;
    proxy_pass http://crm_api;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_read_timeout 60s;
  }

  # Health check passthrough (no rate limit)
  location = /health {
    proxy_pass http://crm_api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
  }

  # Everything else — SPA
  location / {
    limit_req zone=public burst=20 nodelay;
    proxy_pass http://crm_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

